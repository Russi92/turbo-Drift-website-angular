<section class="bg-gray-900 text-white min-h-screen p-6">
  <div

    <p class="text-gray-200 text-lg">Drive the car of your dreams with Turbo & Drift</p>
  </div>

  <div class="my-10 flex justify-center">
    <div class="flex bg-gradient-to-r from-red-500 to-black p-2 rounded-2xl shadow-lg gap-2">
      <a
        routerLink="newCars"
        class="px-6 py-2 rounded-xl font-bold text-white cursor-pointer transition-all duration-300 hover:bg-gray-800 hover:text-white shadow-md"
      >
        New Cars
      </a>
      <div class="w-[2px] h-8 bg-gradient-to-b from-white to-white rounded-full"></div>
      <a
        routerLink="usedCars"

      >
        Used Cars
      </a>
    </div>
  </div>

  <div class="w-[1200px] m-auto flex flex-col md:flex-row justify-between items-center mb-12 gap-4">
    <input
      type="text"
      placeholder="Search for cars..."
      class="px-4 py-2 w-full md:w-[350px] outline-none shadow-lg rounded-lg bg-amber-50 focus:text-black placeholder-gray-400 focus:ring-2 focus:ring-red-500"

    <select class="px-4 py-2 rounded-xl bg-amber-50 text-black w-full md:w-[500px] shadow-lg">
      <option>All Brands</option>
      <option>BMW</option>
      <option>Audi</option>
      <option>Mercedes</option>
    </select>
  </div>

  <div class="w-[1200px] m-auto grid sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
    <div

      <div class="relative h-[250px] overflow-hidden">
        <img
          src="https://cimg3.ibsrv.net/ibimg/hgm/1920x1080-1/100/749/2021-bmw-5-series_100749427.jpg"
          class="w-full h-full object-cover group-hover:scale-110 transition duration-500"
        />

        <div
          class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex flex-col justify-center items-center text-center"
        >
          <button class="bg-red-600 px-6 py-2 rounded-xl font-bold hover:scale-105 transition">
            Quick View
          </button>
        </div>
      </div>

      <div class="p-6">
        <h2 class="text-2xl font-bold mb-2">BMW M5</h2>
        <p class="text-gray-300 mb-4">Luxury sports sedan with top performance & advanced tech.</p>

        <div class="flex justify-between text-sm text-gray-400 mb-4">
          <span>⚡ 600 HP</span>
          <span>⛽ Petrol</span>
          <span>🚀 0-100: 3.4s</span>
        </div>

        <div class="flex justify-between items-center">
          <p class="text-red-500 font-bold text-lg">$150/day</p>
          <button
            class="bg-gradient-to-r from-red-500 to-black px-4 py-2 rounded-xl font-bold hover:scale-105 transition"
          >
            Rent Now
          </button>
        </div>
      </div>
    </div>

    <!-- كرر الكارت لكل عربية -->
  </div>

  <!-- CTA Banner -->
  <div
    class="w-[1200px] m-auto mt-16 p-10 rounded-3xl bg-gradient-to-r from-red-600 to-black flex flex-col md:flex-row justify-between items-center gap-4 text-center"
  >
    <div>
      <h2 class="text-3xl font-bold mb-2">Drive Luxury Today</h2>
      <p class="text-gray-200">Choose your dream car and hit the road with style.</p>
    </div>
    <button class="bg-white text-black px-8 py-3 rounded-xl font-bold hover:bg-gray-200 transition">
      Explore Cars
    </button>
