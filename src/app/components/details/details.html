<div *ngIf="carDetails">
  <div
    class="bg-white/5 backdrop-blur-lg rounded-2xl overflow-hidden shadow-lg hover:shadow-red-500/30 transition-all duration-300 group"
  >
    <div class="h-[520px] overflow-hidden">
      <img
        [ngSrc]="carDetails.img"
        alt=""
        width="300"
        height="300"
        class="w-full h-full object-cover group-hover:scale-110 transition duration-500"
      />
    </div>
    <div class="p-5 text-white">
      <h1 class="text-2xl font-bold mb-2 group-hover:text-red-500 transition">
        {{ carDetails.brand }} {{ carDetails.name }}
      </h1>
      <p class="text-gray-300 text-sm mb-3 line-clamp-2">
        {{ carDetails.description }}
      </p>
      <div class="text-gray-400 text-sm mb-2">Model: {{ carDetails.model }}</div>
      <div class="text-xl font-bold text-red-500 mb-4">
        <span class="text-white">Price: </span>{{ carDetails.price | currency: 'EUR' : 'symbol' : '1.0-0' }}
      </div>
      <button
      (click)="logIn()"
      class="w-full py-2 rounded-lg font-bold bg-gradient-to-r from-red-500 to-black hover:from-red-600 hover:to-black transition-all duration-300 shadow-md cursor-pointer"
      >
      Buy Now
    </button>
  </div>
  </div>
</div>
