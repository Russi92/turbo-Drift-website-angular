<div>
  <div class="bg-gradient-to-r from-red-500 to-black h-12 rounded-xl mb-5">
    <select
      class="w-full appearance-none mb-5 text-black font-semibold px-4 py-3 rounded-xl shadow-lg border border-gray-700 focus:outline-none focus:ring-2 focus:ring-red-500 cursor-pointer"
    >
      <option selected>All Cars</option>
      @for (brand of brands; track brand) {
        <option [value]="brand">{{ brand }}</option>
      }
    </select>
  </div>

  <app-new-cars [userName]="name"></app-new-cars>

  <div
    class="w-full md:w-auto mt-5 bg-gradient-to-r from-red-500 to-black px-6 py-4 rounded-2xl shadow-xl flex items-center gap-3"
  >
    <span class="text-2xl font-semibold text-gray-200">Total Price :</span>

    <h1 class="text-2xl font-bold text-white">{{ number|currency : "EUR" : "symbol" : "1.0-0"}}</h1>
  </div>
</div>
