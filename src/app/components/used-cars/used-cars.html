<section class="bg-black text-white min-h-screen p-6">

    <div class="h-[250px] rounded-3xl flex flex-col justify-center items-center 
                bg-gradient-to-r from-red-600/55 to-black mb-12 shadow-xl">
      <h1 class="text-5xl font-extrabold mb-2 tracking-wide">
        Used Cars Collection
      </h1>
      <p class="text-gray-300">
        Discover high-quality pre-owned cars with great value and reliable performance
      </p>
    </div>

    <div class="max-w-[1400px] mx-auto px-4 py-10">

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
    
        @for(nCars of usedCars; track nCars.id){
    
          <div class="bg-white/5 backdrop-blur-lg rounded-2xl overflow-hidden shadow-lg 
                      hover:shadow-red-500/30 transition-all duration-300 group">
    
            <div class="h-[220px] overflow-hidden">
              <img [ngSrc]="nCars.img" width="400"
              height="300"
                   class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
            </div>
    
            <div class="p-5 text-white">
    
              <h2 class="text-2xl font-bold mb-2 group-hover:text-red-500 transition">
                {{nCars.name}}
              </h2>
    
              <p class="text-gray-300 text-sm mb-3 line-clamp-2">
                {{nCars.description}}
              </p>
    
              <div class="text-gray-400 text-sm mb-2">
                Model: {{nCars.model}}
              </div>
    
              <div class="text-xl font-bold text-red-500 mb-4">
                {{nCars.price | currency:'EUR':'symbol':'1.0-0'}}
              </div>
    
              <button (click)="logIn()"
                class="w-full py-2 rounded-lg font-bold bg-gradient-to-r from-red-500 to-black
                       hover:from-red-600 hover:to-black transition-all duration-300 shadow-md cursor-pointer">
                Buy Now
              </button>
    
            </div>
    
          </div>
    
        }
    
      </div>
    </div>
  
  </section>
