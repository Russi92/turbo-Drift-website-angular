<div class="flex items-center justify-center px-4 mt-15">
  <form
    class="bg-black/50 backdrop-blur-md h-fit p-10 rounded-2xl w-[1000px] shadow-xl"
    [formGroup]="forgotPassword"
  >
    <h2 class="text-3xl font-bold text-white text-center mb-6">Forgot Password</h2>
    <div>
      <input
        type="email"
        placeholder="Email"
        class="w-full px-4 py-3 rounded-lg bg-gray-900 text-white placeholder-gray-400 focus:ring-2 focus:ring-red-500 outline-none my-1"
        name="email"
        formControlName="email"
      />
      <!-- error msg -->
      @if(getControls('email')?.invalid && getControls('email')?.touched){
      <div class="text-red-500 bg-amber-50/10 w-fit p-2 rounded-xs mt-2 text-sm">
        @if(getControls('email')?.errors?.['required']){
        <p>Email is required!</p>
        } @if(getControls('email')?.errors?.['email']){
        <p>Email is not valid!</p>
        }
      </div>
      }
      <!-- error msg -->
    </div>

    <div class="flex justify-center mt-10">
      <button
        type="submit"
        (click)="submitForgotPassword()"
        class="w-2xs cursor-pointer text-white font-bold py-2 px-6 rounded-lg hover:bg-red-600 hover:shadow-lg duration-200 bg-gradient-to-r from-red-500 to-black ms-2 hover:from-red-600 hover:to-black transition-all shadow-md"
      >
        Submit
      </button>
    </div>
  </form>
</div>
